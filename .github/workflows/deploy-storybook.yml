name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Local dev resolves tods-competition-factory through
      # `link:../factory` in pnpm-workspace.yaml. CI has no sibling checkout,
      # so the link must go before install or the package is unresolvable.
      #
      # This used to be `pnpm add tods-competition-factory@latest` after the
      # install. That never actually worked: a pnpm-workspace.yaml `overrides:`
      # entry OUTRANKS the package.json dependency, so the added version was
      # ignored and the dangling link survived. Under pnpm 11 the broken tree
      # happened not to be exercised; under pnpm 12 it surfaces as
      # "Cannot find package 'tods-competition-factory'" in every suite and as a
      # Rolldown resolve failure in the Storybook build.
      #
      # Strips ONLY lines whose value is a `link:`. Deliberately not the
      # whole-block regex used in npm-publish.yml, which also deletes the
      # `typescript: 6.0.3` pin and the `js-yaml@4` security override.
      # Factory then resolves from the version devDependencies pins, which is
      # what consumers actually get -- `@latest` could drift ahead of it.
      - name: Resolve tods-competition-factory from npm (strip the link override)
        run: |
          node -e "
          const fs = require('fs');
          const f = 'pnpm-workspace.yaml';
          const before = fs.readFileSync(f, 'utf8');
          const after = before.split('\n').filter((l) => !/:\s*link:/.test(l)).join('\n');
          if (after === before) throw new Error('no link: override found in ' + f);
          fs.writeFileSync(f, after);
          "

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build-storybook

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
