name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A pnpm that does not match this repo's `packageManager` pin writes an `@pnpm/exe` block
      # into the lockfile; a pnpm that DOES match strips it out again. Committed, it makes every
      # correctly-provisioned checkout permanently dirty and drowns real work in `git status`. It was
      # cleaned out of six repos on 2026-09-08 and reappeared in two working trees the same
      # afternoon, so the committed state needs a guard rather than vigilance.
      #
      # The pattern excludes `@pnpm/exe.<platform>` — those are legitimate optional deps of `pnpm`
      # itself and every clean lockfile holds 24 of them, so the obvious grep fails every repo.
      - name: Lockfiles must not carry an @pnpm/exe block
        run: |
          locks=$(git ls-files '*pnpm-lock.yaml')
          if [ -z "$locks" ]; then
            echo "::error::no tracked pnpm-lock.yaml found — this check would pass vacuously"
            exit 1
          fi
          bad=0
          while IFS= read -r f; do
            if grep -qE "@pnpm/exe[^.]" "$f"; then
              echo "::error file=$f::$f carries an @pnpm/exe block, written only by a pnpm that does not match this repo's packageManager pin. Reinstall with the pinned pnpm and commit the lockfile."
              bad=1
            fi
          done <<LOCKS
          $locks
          LOCKS
          exit $bad

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Local dev resolves tods-competition-factory through
      # `link:../factory` in pnpm-workspace.yaml. CI has no sibling checkout,
      # so the link must go before install or the package is unresolvable.
      #
      # This used to be `pnpm add tods-competition-factory@latest` after the
      # install. That never actually worked: a pnpm-workspace.yaml `overrides:`
      # entry OUTRANKS the package.json dependency, so the added version was
      # ignored and the dangling link survived. Under pnpm 11 the broken tree
      # happened not to be exercised; under pnpm 12 it surfaces as
      # "Cannot find package 'tods-competition-factory'" in every suite and as a
      # Rolldown resolve failure in the Storybook build.
      #
      # Strips ONLY lines whose value is a `link:`. Deliberately not the
      # whole-block regex used in npm-publish.yml, which also deletes the
      # `typescript: 6.0.3` pin and the `js-yaml@4` security override.
      # Factory then resolves from the version devDependencies pins, which is
      # what consumers actually get -- `@latest` could drift ahead of it.
      - name: Resolve tods-competition-factory from npm (strip the link override)
        run: |
          node -e "
          const fs = require('fs');
          const f = 'pnpm-workspace.yaml';
          const before = fs.readFileSync(f, 'utf8');
          const after = before.split('\n').filter((l) => !/:\s*link:/.test(l)).join('\n');
          if (after === before) throw new Error('no link: override found in ' + f);
          fs.writeFileSync(f, after);
          "

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - run: pnpm build-storybook
